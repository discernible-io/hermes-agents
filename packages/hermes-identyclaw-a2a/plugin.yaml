name: a2a-platform
label: A2A (Passport JWT)
kind: platform
version: 1.0.0
description: >
  Overlay for bundled Hermes A2A. Last-writer-wins when installed at
  $HERMES_HOME/plugins/a2a-platform/. Inbound identity is a Passport JWT
  (sidecar validate_jwt); outbound uses sidecar login_server against the
  peer base URL. No static A2A_BEARER_TOKEN.
author: Discernible
capabilities:
  - tools.override
provides_tools:
  - a2a_discover
  - a2a_call
  - a2a_list
  - a2a_history
  - a2a_orchestrate
requires_env: []
optional_env:
  - name: IDENTYCLAW_JWT_AUDIENCE
    description: "Own Passport owner_id — expected JWT aud for inbound P2P tokens."
    prompt: "Passport owner_id (JWT audience)"
    password: false
  - name: IDENTYCLAW_JWT_ISSUER
    description: "JWT iss (default https://api.identyclaw.com)."
    prompt: "JWT issuer URL"
    password: false
  - name: A2A_AUTH_SIDECAR_URL
    description: "Loopback URL of the Passport auth sidecar (default http://127.0.0.1:9910)."
    prompt: "Auth sidecar URL"
    password: false
  - name: A2A_PUBLIC_URL
    description: "Public base advertised on the Agent Card (Passport webhook_url)."
    prompt: "Public A2A URL"
    password: false
  - name: A2A_PORT
    description: "Inbound A2A server port (default 9900)."
    prompt: "A2A port (default 9900)"
    password: false
  - name: A2A_AGENT_NAME
    description: "Name advertised on this agent's Agent Card."
    prompt: "A2A agent name"
    password: false
