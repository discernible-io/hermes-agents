name: identyclaw-a2a
title: IdentyClaw A2A
repo: https://github.com/discernible-io/hermes-identyclaw-a2a
sha: 89304149a34e7312f9741d14be11916857524319
version: "0.1.0"
description: >-
  Passport-authenticated A2A overlay for Hermes: inbound JWT identity (token_id),
  peer login_server via /api/login + /api/login/timestamp, and outbound a2a_call
  that mints per-peer JWTs through the identyclaw-auth sidecar. Requires plugin
  identyclaw-auth (>=0.2.0) with sidecar healthy on :9910. After install: disable
  bundled platforms/a2a, then enable this plugin with tools.override.
  Disclosure — registers platform tools that talk to peer Agent Cards / A2A
  endpoints you configure (A2A_PUBLIC_URL) and to the localhost auth sidecar
  (127.0.0.1:IDENTYCLAW_AUTH_PORT, default 9910); may listen on A2A_PORT
  (default 9900); needs tools.override so its a2a_* tools replace the bundled
  A2A set; no telemetry.
maintainer: discernible-io
tier: community
category: platform
docs_url: https://github.com/discernible-io/hermes-identyclaw-a2a#readme
readme: true
platforms: []
known_issues:
  - Requires identyclaw-auth installed/enabled and `hermes identyclaw sidecar start` (or autostart) before peer calls work.
  - Plugin id is identyclaw-a2a — disable platforms/a2a first; enable with --allow-tool-override.
capabilities:
  provides_tools:
    - a2a_discover
    - a2a_call
    - a2a_list
    - a2a_history
    - a2a_orchestrate
  provides_hooks: []
  provides_middleware: []
  requires_env: []
